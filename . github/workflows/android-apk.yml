
name: Build TAJIR Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TAJIR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract TAJIR project
        run: |
          unzip -q "TAJIR_cloud_android_build_pack (1).zip"

      - name: Use updated TAJIR main.dart
        run: |
          test -f main.dart
          cp main.dart TAJIR_flutter_app/lib/main.dart

      - name: Install Flutter dependencies
        working-directory: TAJIR_flutter_app
        run: |
          flutter create . --platforms=android --org com.tajir --project-name tajir_app --overwrite
          flutter pub get

      - name: Build Android Preview APK
        working-directory: TAJIR_flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=TAJIR_PREVIEW=true \
            --android-skip-build-dependency-validation

      - name: Upload TAJIR Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: TAJIR-Android-Preview-APK
          path: TAJIR_flutter_app/build/app/outputs/flutter-apk/app-debug.apk

