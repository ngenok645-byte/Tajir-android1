name: TAJIR Actions Diagnostic

on:
  push:
    branches:
      - feature/director-account-centre-login
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Verify GitHub Actions runner
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner starts
        run: |
          echo "GitHub Actions runner started successfully."
          echo "Commit: $GITHUB_SHA"
