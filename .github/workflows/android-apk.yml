



name: Build TAJIR Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TAJIR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract TAJIR Flutter app
        run: |
          mkdir -p /tmp/tajir_source
          PUBSPEC_PATH="$(unzip -Z1 TAJIR_flutter_app.zip | grep -E '(^|/)pubspec.yaml$' | head -n 1)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml not found in ZIP"
            exit 1
          fi
          unzip -q -o TAJIR_flutter_app.zip -d /tmp/tajir_source
          PUBSPEC="/tmp/tajir_source/$PUBSPEC_PATH"
          mkdir -p TAJIR_flutter_app
          cp -R "$(dirname "$PUBSPEC")/." TAJIR_flutter_app/

      - name: Prepare Flutter Android project
        working-directory: TAJIR_flutter_app
        run: |
          flutter create . --platforms=android --org com.tajir --project-name tajir_app
          flutter pub get

      - name: Build Android APK
        working-directory: TAJIR_flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --android-skip-build-dependency-validation

      - name: Upload TAJIR APK
        uses: actions/upload-artifact@v4
        with:
          name: TAJIR-Android-APK
          path: TAJIR_flutter_app/build/app/outputs/flutter-apk/app-debug.apk
