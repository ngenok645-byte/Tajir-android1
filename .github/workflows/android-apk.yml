
name: Build TAJIR Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TAJIR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract TAJIR project
        run: unzip -q "TAJIR_cloud_android_build_pack (1).zip"

      - name: Install Flutter dependencies
        working-directory: TAJIR_flutter_app
        run: |
                - name: Install Flutter dependencies
        working-directory: TAJIR_flutter_app
        run: |
          flutter create . --platforms=android --org com.tajir --project-name tajir_app
          sed -i 's/gradle-[0-9.]*-\(all\|bin\)\.zip/gradle-9.5.0-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          rm -f android/build.gradle android/app/build.gradle android/settings.gradle
          flutter pub get

      
    
  

      - name: Upload TAJIR APK
        uses: actions/upload-artifact@v4
        with:
          name: TAJIR-Android-APK
          path: TAJIR_flutter_app/build/app/outputs/flutter-apk/app-debug.apk
