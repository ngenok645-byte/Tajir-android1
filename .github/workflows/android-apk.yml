name: Build TAJIR Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - production-app
jobs:
  build:
    name: Build TAJIR Android App
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract TAJIR Flutter app
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          import shutil

          source = Path("/tmp/tajir_source")
          source.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile("TAJIR_flutter_app.zip") as z:
              z.extractall(source)

          matches = list(source.rglob("pubspec.yaml"))
          if not matches:
              raise SystemExit("ERROR: pubspec.yaml not found")

          app_folder = matches[0].parent
          destination = Path("TAJIR_flutter_app")
          shutil.copytree(app_folder, destination, dirs_exist_ok=True)

          print("Flutter source extracted successfully.")
          PY

      - name: Apply production main.dart
        run: |
          if [ ! -f "main.dart" ]; then
            echo "ERROR: root main.dart not found"
            exit 1
          fi

          if [ ! -f "TAJIR_flutter_app/lib/main.dart" ]; then
            echo "ERROR: extracted Flutter app lib/main.dart not found"
            exit 1
          fi

          cp main.dart TAJIR_flutter_app/lib/main.dart
          echo "Production main.dart copied successfully."

      - name: Apply live Supabase schema integration
        run: python patch_production.py

      - name: Prepare Flutter Android project
        working-directory: TAJIR_flutter_app
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.tajir --project-name tajir_app
          flutter pub get

      - name: Build Android APK
        working-directory: TAJIR_flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --android-skip-build-dependency-validation

      - name: Upload TAJIR APK
        uses: actions/upload-artifact@v4
        with:
          name: TAJIR-Android-APK
          path: TAJIR_flutter_app/build/app/outputs/flutter-apk/app-debug.apk
