

name: Build TAJIR Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TAJIR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract TAJIR project
        run: unzip -q "TAJIR_cloud_android_build_pack (1).zip"

      - name: Install Flutter dependencies
        working-directory: TAJIR_flutter_app
        run: |
          flutter create . --platforms=android --org com.tajir --project-name tajir_app
          rm -f android/build.gradle
          rm -f android/app/build.gradle
          rm -f android/settings.gradle
          sed -i 's/gradle-[0-9.]*-\(all\|bin\)\.zip/gradle-9.5.0-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          flutter pub get
      - name: Extract TAJIR Flutter app
        run: |
          mkdir -p TAJIR_flutter_app
          unzip -q -o Tajir_flutter_app.zip -d /tmp/tajir_source
          PUBSPEC="$(find /tmp/tajir_source -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found in ZIP"
            exit 1
          fi
          cp -a "$(dirname "$PUBSPEC")"/. TAJIR_flutter_app/
      - name: Build Android APK
        working-directory: TAJIR_flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --android-skip-build-dependency-validation

      - name: Upload TAJIR APK
        uses: actions/upload-artifact@v4
        with:
          name: TAJIR-Android-APK
          path: TAJIR_flutter_app/build/app/outputs/flutter-apk/app-debug.apk
