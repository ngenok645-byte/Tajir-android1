# Rebuild after the live customer-profile trigger correction for customer registration.
name: Build TAJIR Android APK
# CI verification run for the phone-and-PIN authentication build.
# Rebuild requested on 2026-11-19.

'on':
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build TAJIR Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract TAJIR Flutter app
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          import shutil
          source = Path("/tmp/tajir_source")
          source.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile("TAJIR_flutter_app.zip") as z:
              z.extractall(source)
          matches = list(source.rglob("pubspec.yaml"))
          if not matches:
              raise SystemExit("ERROR: pubspec.yaml not found")
          app_folder = matches[0].parent
          shutil.copytree(app_folder, Path("TAJIR_flutter_app"), dirs_exist_ok=True)
          print("Flutter source extracted successfully.")
          PY

      - name: Apply TAJIR application entry point
        run: |
          test -f main.dart
          test -f TAJIR_flutter_app/lib/main.dart
          cp main.dart TAJIR_flutter_app/lib/main.dart

      - name: Prepare Flutter Android project
        working-directory: TAJIR_flutter_app
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.tajir --project-name tajir_app
      - name: Install TAJIR update-link platform channel
        working-directory: TAJIR_flutter_app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = list(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          if not files:
              raise SystemExit("Generated Android MainActivity.kt was not found")
          path = files[0]
          old = path.read_text()
          match = re.search(r"package\s+([A-Za-z0-9_.]+)", old)
          package = match.group(1) if match else ".".join(path.parent.parts[-3:])
          path.write_text(f"""package {package}

          import android.content.Intent
          import android.net.Uri
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {{
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "tajir/update")
                      .setMethodCallHandler {{ call, result ->
                          if (call.method == "openUrl") {{
                              val url = call.argument<String>("url")
                              if (url.isNullOrBlank() || !url.startsWith("https://")) {{
                                  result.error("INVALID_URL", "A secure update URL is required.", null)
                              }} else {{
                                  try {{
                                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                                      result.success(true)
                                  }} catch (error: Exception) {{
                                      result.error("OPEN_FAILED", "Could not open the update link.", null)
                                  }}
                              }}
                          }} else {{
                              result.notImplemented()
                          }}
                      }}
              }}
          }}
          """)
          print("TAJIR update-link channel installed.")
          PY
          # The generated Flutter manifest does not include INTERNET permission.
          # Add it explicitly so Android can reach Supabase from the release APK.
          python - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
          ]
          for permission in permissions:
              marker = f'android:name="{permission}"'
              if marker not in source:
                  start = source.find("<manifest")
                  end = source.find(">", start)
                  if start < 0 or end < 0:
                      raise SystemExit("Could not locate Android manifest root element")
                  source = source[:end + 1] + f'\n    <uses-permission android:name="{permission}" />' + source[end + 1:]
          manifest.write_text(source)
          print("Android network permissions verified.")
          PY
          # Flutter's generated settings may resolve Kotlin plugin transitive artifacts
          # only from the Gradle Plugin Portal. Add Google and Maven Central explicitly.
          python - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          if "pluginManagement" not in s:
              raise SystemExit("pluginManagement block missing from Android settings")
          if "mavenCentral()" not in s:
              s = s.replace("repositories {", "repositories {\\n        google()\\n        mavenCentral()", 1)
          elif "google()" not in s:
              s = s.replace("repositories {", "repositories {\\n        google()", 1)
          p.write_text(s)
          print("Android plugin repositories verified.")
          PY
          flutter pub get
          # Work around an Android Lint detector crash in the current toolchain.
          # This skips only the release lint analysis task; APK compilation remains enabled.
          # Disable the broken lint task across ALL Android subprojects (including plugins).
          cat >> android/build.gradle.kts <<'GRADLE'
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          GRADLE

      - name: Build TAJIR Android APK
        working-directory: TAJIR_flutter_app
        env:
          SUPABASE_URL: https://zgqwjlyyinaapfmiomjo.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=TAJIR_VERSION="${GITHUB_RUN_NUMBER}" \
            --android-skip-build-dependency-validation

      - name: Upload TAJIR Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TAJIR-Android-APK
          path: TAJIR_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish versioned update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TAJIR v${{ github.run_number }}
          generate_release_notes: true
          files: TAJIR_flutter_app/build/app/outputs/flutter-apk/app-release.apk
